<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Enter your height and weight to check your Body Mass Index.</p>

    <form id="bmiForm">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 170" min="1" step="0.1" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 65" min="1" step="0.1" required>

      <button type="submit">Calculate BMI</button>
    </form>

    <div id="result" class="result"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
